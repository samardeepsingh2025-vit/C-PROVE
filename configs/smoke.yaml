# CPU smoke configuration: heuristic decomposer, lexical NLI, no model downloads.
seed: 42
paths:
  data: data
  cache: cache/smoke
  models: models/smoke
  outputs: outputs/smoke
  bench: data/meetverify
data:
  corpus: toy
  split_seed: 42
  split_ratio:
  - 0.7
  - 0.15
  - 0.15
  max_meetings: null
llm:
  backend: heuristic
  gguf_path: models/qwen2.5-7b-instruct-q4_k_m.gguf
  n_ctx: 8192
  n_gpu_layers: -1
  temperature: 0.0
  max_tokens: 768
  ollama_model: qwen2.5:7b-instruct-q4_K_M
  ollama_url: http://localhost:11434
  openai_compat_url: http://localhost:8080/v1
  cache_file: cache/smoke/llm_cache.jsonl
summarisers:
- name: qwen2.5-7b
  gguf_path: models/qwen2.5-7b-instruct-q4_k_m.gguf
- name: llama3.1-8b
  gguf_path: models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
- name: mistral-7b
  gguf_path: models/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
frames:
  max_claims_per_sentence: 4
  use_llm: false
retrieval:
  encoder: BAAI/bge-base-en-v1.5
  dense_weight: 0.7
  sparse_weight: 0.3
  top_k: 5
  context_window: 2
  slot_boost: 0.15
nli:
  model: lexical
  minicheck: lytang/MiniCheck-Flan-T5-Large
  use_minicheck: false
  batch_size: 8
  max_length: 512
  fp16: true
graph:
  window_sents: 3
  edge_classifier: null
  min_edge_conf: 0.5
dimensions:
  status_classifier: null
  da_classifier: models/da_clf
  calibration: isotonic
  calibrators: models/smoke/calibrators.pkl
hlmrf:
  solver: pgd
  iters: 200
  lr: 0.1
  tol: 1.0e-05
  squared: true
  init_weights:
    R1_evidence: 2.0
    R1b_contradiction: 2.0
    R2_attribution: 1.5
    R3_temporal: 1.0
    R4_revision: 1.5
    R5_status: 1.5
    R6_dependency: 1.0
    R7_exclusion: 2.0
    R8_agent: 0.8
    R9a_upper: 3.0
    R9b_lower: 1.5
    R10_prior: 0.05
    R10b_rsn_prior: 0.5
    RJ_judge: 2.5
  learned_weights: models/smoke/rule_weights.json
  learn:
    unroll: 50
    epochs: 30
    lr: 0.05
    l2: 0.001
adaptive:
  scheduler: voi
  budget_frac: 0.25
  epsilon: 0.02
  judge_weight: 2.5
mti:
  omega:
    decision: 2.0
    action_item: 2.0
    fact: 1.0
    opinion: 1.0
    event: 1.0
  conformal_alpha: 0.1
  components:
  - coverage
  - contradiction_density
  - attribution
  - temporal
  - support_quality
labels:
  risk_alpha: 0.1
  tau_supported: 0.5
train:
  status_clf:
    base: microsoft/deberta-v3-base
    epochs: 4
    lr: 2.0e-05
    batch_size: 16
    grad_accum: 2
    max_length: 192
    fp16: true
  edge_clf:
    base: microsoft/deberta-v3-base
    epochs: 4
    lr: 2.0e-05
    batch_size: 16
    max_length: 160
  qlora_frames:
    base: Qwen/Qwen2.5-3B-Instruct
    r: 16
    alpha: 32
    epochs: 2
    lr: 0.0002
    batch_size: 2
    grad_accum: 8
    max_length: 1024
eval:
  bootstrap: 10000
  seeds:
  - 13
  - 42
  - 2026
